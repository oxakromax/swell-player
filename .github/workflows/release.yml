name: Release

# Builds every package and, when the run is for a tag v<version> (matching
# Cargo.toml), attaches them to a draft GitHub Release of that tag, to be
# reviewed and published by hand:
#
# - pushing a tag v<version>: packages and the draft release;
# - running it by hand (workflow_dispatch) on a branch: the same packages,
#   as workflow artifacts only, with no release;
# - running it by hand on a tag ("Use workflow from" a v<version> tag): the
#   same as pushing that tag, so it creates, or adds to, that tag's draft.
#
# The Intel macOS build is best effort: Homebrew may have to build its GTK
# stack from source on that runner and time out. When it fails the release
# is still drafted, without the Intel disk image; every other package is
# required.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Packaging tools, pinned so a release does not change with their updates.
  CARGO_ABOUT_VERSION: 0.9.2
  CARGO_DEB_VERSION: 3.8.0
  CARGO_GENERATE_RPM_VERSION: 0.21.0
  INNO_SETUP_VERSION: 6.7.1

# Third-party actions and the Flatpak container are pinned by digest
# (Dependabot keeps the actions current). Checkouts keep no credentials.
jobs:
  meta:
    name: Version and licence notices
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: version
        run: |
          version=$(packaging/release.sh version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            packaging/release.sh check-tag "$GITHUB_REF_NAME"
          fi

      # The licences of the Rust crates in the binary, for every target
      # (about.toml): one file that every package below ships.
      - name: Third-party licence notices
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-about --version "$CARGO_ABOUT_VERSION" --locked --features cli
          packaging/release.sh licenses dist/THIRD-PARTY-LICENSES.txt

      - uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: dist/THIRD-PARTY-LICENSES.txt
          if-no-files-found: error

  # Debian 13 (GTK 4.18, libadwaita 1.7, glibc 2.41) without the default
  # `adw-1-8` feature: the .deb, and the tarball made from the same binary,
  # then run on Debian 13, Ubuntu 25.04 and anything newer.
  linux-deb:
    name: Linux – tarball and .deb (GTK 4.18 build)
    needs: meta
    runs-on: ubuntu-latest
    container: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl dpkg-dev git pkgconf \
            libgtk-4-dev libadwaita-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libglib2.0-dev-bin libsqlite3-dev
          # Distribution compilers lag behind what the dependencies need.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain stable
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo install cargo-deb --version "$CARGO_DEB_VERSION" --locked

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: third-party-licenses
          path: target/release

      - name: Build
        run: packaging/release.sh build --no-default-features

      - name: Tarball
        run: packaging/release.sh tarball dist

      - name: .deb
        run: packaging/release.sh deb dist

      - uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  linux-rpm:
    name: Linux – .rpm
    needs: meta
    runs-on: ubuntu-latest
    container: fedora:43
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make git pkgconf-pkg-config \
            gtk4-devel libadwaita-devel gstreamer1-devel gstreamer1-plugins-base-devel \
            glib2-devel sqlite-devel
          # Distribution compilers lag behind what the dependencies need.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain stable
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo install cargo-generate-rpm --version "$CARGO_GENERATE_RPM_VERSION" --locked

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: third-party-licenses
          path: target/release

      - name: Build
        run: packaging/release.sh build

      - name: .rpm
        run: packaging/release.sh rpm dist

      - uses: actions/upload-artifact@v7
        with:
          name: linux-rpm
          path: dist/*.rpm
          if-no-files-found: error

  flatpak:
    name: Linux – Flatpak bundle
    needs: meta
    runs-on: ubuntu-latest
    container:
      # Keep the GNOME version in step with runtime-version in the manifest;
      # the digest is the gnome-49 tag's on 2026-10-18 (look it up again with
      # `docker buildx imagetools inspect ghcr.io/flathub-infra/flatpak-github-actions:gnome-49`).
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49@sha256:8a05aca51163a81259cc011302cc5121779c89b8b16f2819cc3fd06817d136e7
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/flatpak/io.github.oxakromax.SwellPlayer.yml
          bundle: swell-player-${{ needs.meta.outputs.version }}-x86_64.flatpak
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/**', 'Cargo.lock') }}
          upload-artifact: true

  windows:
    name: Windows – portable zip and installer
    needs: meta
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep line endings as committed
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          "CARGO_HOME=$env:RUNNER_TEMP\cargo-home" >> $env:GITHUB_ENV

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-glib-networking
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-libsoup3
            mingw-w64-ucrt-x86_64-ca-certificates
            mingw-w64-ucrt-x86_64-sqlite3

      - uses: actions/download-artifact@v8
        with:
          name: third-party-licenses
          path: target/release

      # build.rs links it into swell-player.exe (window and Explorer icon),
      # and bundle.sh puts the same file next to it for the installer.
      - name: Icon
        run: |
          packaging/windows/make-ico.sh data/icons/scalable/apps/io.github.oxakromax.SwellPlayer.svg \
            packaging/windows/swell.ico
          ls -l packaging/windows/swell.ico

      - name: Build
        run: cargo build --release --locked

      - name: Bundle
        run: |
          packaging/windows/bundle.sh --out dist/windows/Swell \
            --zip "dist/swell-player-$VERSION-windows-x86_64-portable.zip"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe")
          $iscc = Get-ChildItem $candidates -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --version $env:INNO_SETUP_VERSION --no-progress -y
            $iscc = Get-ChildItem $candidates -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup (ISCC.exe) not found" }
          & $iscc.FullName "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\dist\windows\Swell" "/DOutputDir=$PWD\dist" packaging\windows\swell.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  # Apple silicon (required) and Intel (best effort: `continue-on-error`,
  # and `publish` does not wait for it to succeed). One job with a matrix
  # would give `publish` a single result for both.
  macos:
    name: macOS (arm64) – app and disk image
    needs: meta
    runs-on: macos-14
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      ARCH: arm64
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps: &macos-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          brew install gtk4 libadwaita gstreamer pkgconf sqlite librsvg glib-networking libsoup \
            adwaita-icon-theme hicolor-icon-theme ca-certificates jq
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/download-artifact@v8
        with:
          name: third-party-licenses
          path: target/release

      - name: Build
        env:
          # Room in the load commands for the bundle's @loader_path names.
          RUSTFLAGS: -C link-arg=-Wl,-headerpad_max_install_names
        run: cargo build --release --locked

      - name: Bundle
        run: |
          packaging/macos/bundle.sh --out dist/macos \
            --dmg "dist/swell-player-$VERSION-macos-$ARCH.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ env.ARCH }}
          path: dist/*.dmg
          if-no-files-found: error

  macos-intel:
    name: macOS (x86_64, best effort) – app and disk image
    needs: meta
    runs-on: macos-15-intel
    continue-on-error: true
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      ARCH: x86_64
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps: *macos-steps

  publish:
    name: Draft release
    # always(): run even when the best-effort Intel macOS build failed or
    # was cancelled; every other package must have been built.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.meta.result == 'success' &&
      needs.linux-deb.result == 'success' &&
      needs.linux-rpm.result == 'success' &&
      needs.flatpak.result == 'success' &&
      needs.windows.result == 'success' &&
      needs.macos.result == 'success'
    needs: [meta, linux-deb, linux-rpm, flatpak, windows, macos, macos-intel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Whatever was built, the Intel disk image included when it exists.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          ls -l dist
          packaging/release.sh checksums dist

      - name: Release notes
        env:
          INTEL_RESULT: ${{ needs.macos-intel.result }}
        run: |
          if compgen -G "dist/*-macos-x86_64.dmg" >/dev/null; then
            mac_row="| macOS (Apple silicon / Intel) | \`…-macos-arm64.dmg\` / \`…-macos-x86_64.dmg\` |"
          else
            echo "::warning::no Intel macOS disk image (macos-intel: $INTEL_RESULT); drafting the release without it"
            mac_row="| macOS (Apple silicon) | \`…-macos-arm64.dmg\` |"
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Swell $VERSION

          ## Downloads

          | System | File |
          |---|---|
          | Linux (any distribution with GTK ≥ 4.18, libadwaita ≥ 1.7, glibc ≥ 2.41, GStreamer good plugins) | \`swell-player-$VERSION-linux-x86_64.tar.gz\` (run \`./install.sh\` or \`./install.sh --user\`) |
          | Debian 13 / Ubuntu 25.04 or newer | \`.deb\` |
          | Fedora (43 or newer) | \`.rpm\` |
          | Any distribution, sandboxed | \`swell-player-$VERSION-x86_64.flatpak\` (\`flatpak install --user ./swell-player-$VERSION-x86_64.flatpak\`) |
          | Windows 10/11 (x64) | \`…-windows-x86_64-setup.exe\` (installer) or \`…-windows-x86_64-portable.zip\` |
          $mac_row

          \`SHA256SUMS\` lists the checksums of every file. \`THIRD-PARTY-LICENSES.txt\` has the licences
          of the Rust crates built into Swell (every package carries it too).

          ## Unsigned builds

          - **Windows**: the installer and the executable are not code-signed, so SmartScreen may say it
            "protected your PC": choose *More info*, then *Run anyway*.
          - **macOS**: the app is signed ad hoc, not with an Apple Developer ID, and not notarised, so
            Gatekeeper refuses to open it the first time. Open it once, then allow it in *System Settings
            → Privacy & Security → Open Anyway*, or run
            \`xattr -dr com.apple.quarantine /Applications/Swell.app\`.

          Swell is not affiliated with TIDAL; a paid TIDAL subscription is needed.
          EOF

      - name: Create or update the draft release
        run: |
          tag=$GITHUB_REF_NAME
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* --draft --verify-tag \
              --title "Swell $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --repo "$GITHUB_REPOSITORY"
          fi
