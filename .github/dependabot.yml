version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # gtk-rs crates (glib, gio, gtk4, libadwaita, gstreamer...) move together.
      gtk-rs:
        patterns:
          - "glib*"
          - "gio*"
          - "gtk4*"
          - "gdk4*"
          - "gsk4*"
          - "libadwaita*"
          - "gstreamer*"
          - "pango*"
          - "cairo*"
          - "graphene*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
