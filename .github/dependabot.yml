version: 2
updates:
  # CI fails a Cargo.lock update until packaging/flatpak/cargo-sources.json is
  # regenerated for it (packaging/flatpak/update-cargo-sources.sh, pushed to
  # the Dependabot branch), and when a new crate's licence is not accepted
  # in about.toml.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # gtk-rs crates (glib, gio, gtk4, libadwaita, gstreamer...) move together.
      gtk-rs:
        patterns:
          - "glib*"
          - "gio*"
          - "gtk4*"
          - "gdk4*"
          - "gsk4*"
          - "libadwaita*"
          - "gstreamer*"
          - "pango*"
          - "cairo*"
          - "graphene*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
