[package]
name = "swell-player"
version = "0.1.0"
edition = "2024"
description = "A lightweight native TIDAL client for Linux (GTK 4 + libadwaita + GStreamer)"
license = "GPL-3.0-or-later"
keywords = ["tidal", "music", "gtk4", "libadwaita", "gstreamer"]
categories = ["multimedia::audio"]

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"] }
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
glib-unix = "0.22.8"
gst = { version = "0.25.4", package = "gstreamer" }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_20"] }
log = "0.4.34"
lru = "0.18.5"
oo7 = { version = "0.6.0", default-features = false, features = ["tokio", "native_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "hickory-dns", "query", "form"] }
rusqlite = { version = "0.40.2", features = ["fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
url = "2.5.8"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time", "fs", "macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
